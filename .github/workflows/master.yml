name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pierwszy krok - budowanie frontend assets
  frontend-build:
    name: Frontend - Build Assets
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build for production
        run: NODE_ENV=production npm run build

      - name: Upload built assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: public/build
          retention-days: 1

  backend:
    name: Backend - Tests and Static Analysis
    runs-on: ubuntu-latest
    needs: frontend-build  # Czeka na zbudowanie assets
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      CI: true
      COMPOSER_NO_INTERACTION: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pdo, pgsql, pdo_pgsql, bcmath, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Pobieranie zbudowanych assets
      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: public/build

      - name: Prepare application environment
        run: |
          cat > .env << EOF
          APP_ENV=testing
          APP_DEBUG=false
          APP_KEY=
          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=testing
          DB_USERNAME=sail
          DB_PASSWORD=password
          VITE_APP_NAME="Menu Maker"
          EOF
          php artisan key:generate --ansi

      - name: Run database migrations
        run: php artisan migrate --graceful --no-interaction -v

      - name: Code style (Pint)
        run: composer pint-test

      - name: Static analysis (Larastan)
        run: composer phpstan

      - name: Run test suite (Pest)
        run: composer test

      - name: Validate production caches
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

  # Opcjonalny job dla E2E testów
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-build, backend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.base_ref == 'main'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pdo, pgsql, pdo_pgsql, bcmath, intl

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: public/build

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Prepare test environment
        run: |
          cat > .env << EOF
          APP_ENV=testing
          APP_DEBUG=false
          APP_KEY=
          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=testing
          DB_USERNAME=sail
          DB_PASSWORD=password
          QUEUE_CONNECTION=database
          VITE_APP_NAME="Menu Maker"
          EOF
          php artisan key:generate --ansi
          php artisan migrate --graceful --no-interaction -v
          php artisan db:seed --class=E2eMealPlanSeeder --no-interaction

      - name: Start queue worker
        run: php artisan queue:work --tries=1 > storage/logs/queue.log 2>&1 &

      - name: Run E2E tests
        run: npm run test:e2e



      - name: Upload Laravel and queue logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-laravel-logs
          path: storage/logs/*.log
          if-no-files-found: ignore
