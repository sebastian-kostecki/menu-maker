# nginx in front of PHP-FPM inside the app container. Traefik terminates TLS and talks plain
# HTTP to port 80. REMOTE_ADDR stays Traefik's address on proxy-menu; Laravel takes the
# visitor's IP from X-Forwarded-For (trustProxies in bootstrap/app.php), so no real_ip here.
user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Traefik already writes the access log.
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    # The app takes no file uploads: forms and JSON only. nginx buffers the whole body before
    # PHP sees it, so a slow client never holds a PHP worker.
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 60s;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Vite build: file names carry a content hash.
        location ^~ /build/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /favicon.ico { log_not_found off; }
        location = /robots.txt { log_not_found off; }

        location = /index.php {
            fastcgi_pass unix:/run/php/php8.5-fpm.sock;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            # httpoxy: never let a request header become the HTTP_PROXY environment variable.
            fastcgi_param HTTP_PROXY "";
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 120s;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
        }

        # Only the front controller runs PHP; no dotfiles.
        location ~ \.php$ {
            return 404;
        }
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
