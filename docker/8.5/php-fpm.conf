; PHP-FPM for the web requests. The queue worker and the scheduler stay on the CLI.
; Plan generation (AI calls) runs in the queue, so web requests stay short.
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
user = sail
group = sail
listen = /run/php/php8.5-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Workers start on demand and exit when idle: about 40-60 MB each, at most 4 within the
; container's 768 MB, next to the queue worker and the scheduler.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 60s
pm.max_requests = 500

; Kill a request that runs away (nginx gives up after 120 s too).
request_terminate_timeout = 120s

; Keep the container environment (variables_order=EGPCS, as under artisan serve).
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Web requests only: the CLI (queue, scheduler, artisan) keeps its own limits.
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
